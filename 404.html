<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Favanim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style media="screen">
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #f5f1e8;
        font-family: 'Inter', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .frame {
        max-width: 560px;
        width: 100%;
        border: 1px solid rgba(245, 241, 232, 0.4);
        padding: 48px 40px;
        text-align: center;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(245, 241, 232, 0.6);
      }
      h1 {
        font-family: 'Anton', sans-serif;
        font-weight: 400;
        font-size: clamp(120px, 25vw, 200px);
        line-height: 0.85;
        text-transform: uppercase;
        color: #FFD60A;
        margin: 24px 0 16px;
      }
      h2 {
        font-family: 'Anton', sans-serif;
        font-weight: 400;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        margin-bottom: 16px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: rgba(245, 241, 232, 0.6);
        margin-bottom: 32px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 22px;
        background: #FFD60A;
        color: #0a0a0a;
        border: 1px solid #FFD60A;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-decoration: none;
        transition: all .18s ease;
      }
      a:hover { background: #0a0a0a; color: #FFD60A; }
      .foot {
        margin-top: 32px;
        padding-top: 18px;
        border-top: 1px solid rgba(245, 241, 232, 0.12);
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(245, 241, 232, 0.35);
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="eyebrow">— Erreur de navigation</div>
      <h1>404</h1>
      <h2>Page introuvable</h2>
      <p>Cette page n'existe pas ou a été déplacée. Vérifiez l'URL ou retournez au catalogue.</p>
      <a href="/">Retour au catalogue →</a>
      <div class="foot">
        <span>№ 404/X</span>
        <span>Favanim · ファブアニム</span>
      </div>
    </div>
  </body>
</html>
